    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090b09;
      }

      #app-loading-shell {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f4f7ef;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b09;
        transition: opacity 160ms ease, visibility 160ms ease;
      }

      #app-loading-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(199, 255, 61, 0.08);
        opacity: 0.42;
      }

      .app-loading-card {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: min(360px, calc(100vw - 56px));
        padding: 26px 30px;
        border: 1px solid rgba(244, 247, 239, 0.11);
        border-radius: 8px;
        background: #151915;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.44);
      }

      .app-loading-logo {
        display: block;
        width: 68px;
        height: 68px;
        object-fit: cover;
        border: 1px solid rgba(199, 255, 61, 0.24);
        border-radius: 17px;
        background: #090b09;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
      }

      .app-loading-title {
        color: #f4f7ef;
        font-size: 15px;
        font-weight: 700;
      }

      .app-loading-subtitle {
        color: #9aa392;
        font-size: 12px;
      }

      .app-loading-line {
        width: min(220px, 62vw);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(244, 247, 239, 0.1);
      }

      .app-loading-line span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #c7ff3d;
        animation: jiaren-loading-line 1.05s ease-in-out infinite;
      }

      body.jiaren-app-mounted #app-loading-shell,
      #root[data-jiaren-mounted="true"] + #app-loading-shell,
      #root:not(:empty) + #app-loading-shell {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes jiaren-loading-line {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
